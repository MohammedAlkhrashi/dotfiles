# prefix
set-option -g prefix C-a
set-option -g prefix2 C-b

# 0 is too far from ` ;)
set -g base-index 1

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

set -g status-keys vi
set -g history-limit 10000

setw -g mode-keys vi
# setw -g monitor-activity on

set -g mouse on

# bind-key v split-window -h
# bind-key s split-window -v

bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key H resize-pane -L 5
bind-key L resize-pane -R 5

bind-key M-j resize-pane -D
bind-key M-k resize-pane -U
bind-key M-h resize-pane -L
bind-key M-l resize-pane -R

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Use Alt-vim keys without prefix key to switch panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D 
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# No delay for escape key press
set -sg escape-time 0

# Reload tmux config
bind r source-file ~/.tmux.conf



# THEME
# set -g @plugin 'jimeh/tmux-themepack'
# source-file "${HOME}/.tmux-themepack/powerline/default/blue.tmuxtheme"

set -g status-bg black
set -g status-fg white
set -g window-status-style fg=white
set -g window-status-style bg=black
set -g window-status-current-style bold
set -g status-interval 60
set -g status-left-length 30
set -g status-left '#[fg=green](#S) #(whoami)'
set -g status-right '#[fg=yellow]#(cut -d " " -f 1-3 /proc/loadavg)#[default] #[fg=white]%H:%M#[default]'

set -g status-left '#(curl "wttr.in/?format=3") '
set -g renumber-windows on


# hyperlink
set -as terminal-features ",*:hyperlinks"
set -as terminal-overrides ',*:allow-passthrough'




# Terminal
set -g default-terminal "xterm-256color"



# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_action 'copy-pipe'
set -g @yank_with_mouse on
set -g @yank_selection_mouse 'clipboard'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Vim-like copy mode (after TPM so these override plugin defaults)
#   v     character-wise visual select
#   C-v   block visual select
#   V     line-wise visual select (tmux default)
#   o     swap selection anchor (tmux default)
#   y     yank to clipboard, stay in copy mode (@yank_action)
#   Y     yank current line
#   Enter same as y
#   Esc   clear selection
#   q     exit copy mode
bind-key -T copy-mode-vi v send-keys -X rectangle-off \; send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-on \; send-keys -X begin-selection
bind-key -T copy-mode-vi Y send-keys -X select-line \; send-keys y
bind-key -T copy-mode-vi Enter send-keys y

# Mouse scroll: exit copy mode when wheel reaches the live view (bottom)
bind-key -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 5 scroll-down \; if-shell "[ #{scroll_position} -eq 0 ] 2>/dev/null" "send-keys -X cancel" ""

